name: Recherche de vols

on:
  workflow_dispatch:
    inputs:
      origines:
        description: Aéroports de départ (codes IATA séparés par des virgules)
        default: PAR,MPL,FNI,MRS
      dests:
        description: Aéroports d'arrivée
        default: IST,SAW
      mois:
        description: Mois de départ (AAAA-MM)
        default: "2027-02"
      sejours:
        description: Durées de séjour en jours
        default: "12,14,16"
  schedule:
    - cron: "0 5 * * *"  # chaque matin vers 6 h (heure de Paris), relance la dernière recherche

permissions:
  contents: write

concurrency:
  group: recherche
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q fast-flights==3.1.0 typing_extensions
      - name: Relancer la dernière recherche (passage du matin)
        if: github.event_name == 'schedule'
        run: python scraper/scan.py --reprendre
      - name: Scraper Google Flights
        if: github.event_name != 'schedule'
        env:
          ORIGINES: ${{ inputs.origines || 'PAR,MPL,FNI,MRS' }}
          DESTS: ${{ inputs.dests || 'IST,SAW' }}
          MOIS: ${{ inputs.mois || '2027-02' }}
          SEJOURS: ${{ inputs.sejours || '12,14,16' }}
        run: python scraper/scan.py --origines "$ORIGINES" --dests "$DESTS" --mois "$MOIS" --sejours "$SEJOURS"
      - name: Enregistrer les résultats
        run: |
          git config user.name "robot-vols"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultats.json
          git diff --cached --quiet || git commit -qm "Résultats du $(date +%Y-%m-%d)"
          git pull -q --rebase && git push -q
